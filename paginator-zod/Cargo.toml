[package]
name = "paginator-zod"
version = "0.3.1"
edition = "2021"
authors = ["Maulana Sodiqin <sodiqincahyana1@gmail.com>"]
description = "zod-rs integration for paginator-rs: validate pagination query input and generate TypeScript response schemas"
license = "MIT"
repository = "https://github.com/maulanasdqn/paginator-rs"
readme = "../README.md"
keywords = ["pagination", "validation", "zod", "schema"]
categories = ["web-programming", "data-structures"]

[dependencies]
paginator-rs = { path = "../paginator-rs", version = "0.3.1" }
paginator-utils = { path = "../paginator-utils", version = "0.3.1" }
zod-rs = { path = "../../zod-rs/zod-rs", version = "1.1" }
zod-rs-util = { path = "../../zod-rs/zod-rs-util", version = "1.1" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
paginator-rs = { path = "../paginator-rs" }
